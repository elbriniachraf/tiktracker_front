<form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
  <div class="form-header">
    <h2>Ajouter un Service</h2>
    <button type="button" class="close-btn">&times;</button>
  </div>
  
  <div class="form-group">
    <input id="referenceService" type="text" formControlName="referenceService" class="form-control" placeholder="Référence du Service">
  </div>
  
  <div class="form-group">
    <input id="serviceName" type="text" formControlName="serviceName" class="form-control" placeholder="Nom du Service">
  </div>
  
  <div class="form-row">
    <div class="form-group half">
      <select id="unite" formControlName="unite" class="form-control"  required>
        <option value="" disabled selected>Unité</option>
        <!-- Options ici -->
      </select>
    </div>
    
    <div class="form-group half">
      <select id="duree" formControlName="duree" class="form-control" required>
        <option value="" disabled selected>Durée</option>
        <!-- Options ici -->
      </select>
    </div>
  </div>
  
  <div class="form-group">
    <select id="categorie" formControlName="categorie" class="form-control" required>
      <option value="" disabled selected>Catégorie</option>
      <!-- Options ici -->
    </select>
  </div>
  
  <div class="form-group">
    <select id="departement" formControlName="departement" class="form-control" required>
      <option value="" disabled selected>Département</option>
      <!-- Options ici -->
    </select>
  </div>
  
  <div class="form-row">
    <div class="form-group half">
      <select id="prix" formControlName="prix" class="form-control" required>
        <option value="" disabled selected>Prix Unitaire</option>
        <!-- Options ici -->
      </select>
    </div>
    
    <div class="form-group half">
      <select id="tva" formControlName="tva" class="form-control" required>
        <option value="" disabled selected>TVA (%)</option>
        <!-- Options ici -->
      </select>
    </div>
  </div>
  
  <div class="form-group">
    <select id="statut" formControlName="statut" class="form-control" required>
      <option value="" disabled selected>Statut</option>
      <!-- Options ici -->
    </select>
  </div>
  
  <div class="form-group">
    <textarea id="description" formControlName="description" class="form-control" rows="3" placeholder="Description"></textarea>
  </div>
  
  <button type="submit" class="btn-submit">Sign in</button>
</form>
